openapi: 3.0.3
info:
  title: NovaPay Renamed Provider API
  description: Тот же платёжный контракт, но с переименованными endpoint, полями,
    статусами и Bearer auth.
  version: 1.0.0
  contact:
    name: NovaPay Integration Team
    email: integration@novapay.example
servers:
- url: https://api.sandbox.novapay.example/v1
  description: Sandbox
- url: https://api.novapay.example/v1
  description: Production
tags:
- name: Payouts
  description: Операции выплат
- name: Webhooks
  description: Уведомления о смене статуса
paths:
  /balance:
    get:
      tags:
      - Payouts
      summary: Баланс провайдера
      operationId: getBalance
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Текущий баланс
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer
                    description: Баланс в копейках
                    example: 500000000
                  currency:
                    type: string
                    example: RUB
                  hold:
                    type: integer
                    description: Замороженная сумма
                    example: 15000000
  /transfers:
    post:
      tags:
      - Payouts
      summary: Инициировать перевод
      description: 'Создаёт новую выплату на счёт получателя через СБП.

        Сумма передаётся в копейках. Минимальная сумма — 1000 RUB (100000 коп.).

        '
      operationId: initiateTransfer
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutRequest'
            examples:
              sbp_payout:
                summary: Выплата через СБП
                value:
                  currency: RUB
                  recipient:
                    type: sbp
                    phone: '79001234567'
                    bank_code: '044525225'
                    bank_name: Сбербанк
                  sum: 1500000
                  reference_id: op_abc123
      responses:
        '201':
          description: Выплата создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
              example:
                status: pending
                currency: RUB
                created_at: '2026-07-30T10:00:00Z'
                transaction_id: np_7f3a9b2c
                reference_id: op_abc123
                state: queued
                sum: 1500000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Недостаточно средств на балансе провайдера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: insufficient_balance
                  message: Insufficient provider balance
        '409':
          description: Дубликат по idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: validation_error
                  message: Amount must be at least 100000 kopecks
                  details:
                  - field: amount
                    message: minimum is 100000
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /operations/{transaction_id}:
    get:
      tags:
      - Payouts
      summary: Получить состояние перевода
      operationId: retrieveOperation
      security:
      - BearerAuth: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
        example: np_7f3a9b2c
      responses:
        '200':
          description: Статус выплаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Выплата не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: Payout not found
  /operations/{transaction_id}/cancel:
    post:
      tags:
      - Payouts
      summary: Отменить выплату
      description: Отмена возможна только в статусах pending и processing
      operationId: cancelTransfer
      security:
      - BearerAuth: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Выплата отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '409':
          description: Невозможно отменить в текущем статусе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_status
                  message: Cannot cancel payout in status completed
  /events/transfers:
    post:
      tags:
      - Webhooks
      summary: Событие изменения состояния перевода
      description: 'NovaPay отправляет POST-запрос на URL, указанный при регистрации.

        Подпись передаётся в заголовке X-NovaPay-Signature (HMAC-SHA256).

        '
      operationId: transferNotification
      security: []
      parameters:
      - name: X-NovaPay-Signature
        in: header
        required: true
        schema:
          type: string
        description: HMAC-SHA256 подпись тела запроса
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
            examples:
              completed:
                summary: Выплата завершена
                value:
                  event: transfer.succeeded
                  completed_at: '2026-07-30T10:05:00Z'
                  transaction_id: np_7f3a9b2c
                  reference_id: op_abc123
                  state: succeeded
              failed:
                summary: Выплата отклонена
                value:
                  event: transfer.failed
                  error:
                    code: recipient_not_found
                    message: Recipient account not found
                  transaction_id: np_7f3a9b2c
                  reference_id: op_abc123
                  state: failed
      responses:
        '200':
          description: Webhook принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token провайдера
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Ключ идемпотентности для предотвращения дублей
  schemas:
    CreatePayoutRequest:
      type: object
      required:
      - sum
      - currency
      - reference_id
      - recipient
      properties:
        sum:
          type: integer
          description: Сумма перевода в копейках
          minimum: 100000
          example: 1500000
        currency:
          type: string
          enum:
          - RUB
          example: RUB
        reference_id:
          type: string
          description: Клиентский reference операции
          maxLength: 64
          example: op_abc123
        recipient:
          $ref: '#/components/schemas/Recipient'
    Recipient:
      type: object
      required:
      - type
      - phone
      properties:
        type:
          type: string
          enum:
          - sbp
          - card
          example: sbp
        phone:
          type: string
          pattern: ^7\d{10}$
          description: Телефон получателя (11 цифр, начинается с 7)
          example: '79001234567'
        bank_code:
          type: string
          description: БИК банка (обязателен для type=sbp)
          example: '044525225'
        bank_name:
          type: string
          example: Сбербанк
        card_number:
          type: string
          description: Номер карты (обязателен для type=card)
          example: '4111111111111111'
    PayoutResponse:
      type: object
      properties:
        transaction_id:
          type: string
          example: np_7f3a9b2c
        reference_id:
          type: string
          example: op_abc123
        state:
          type: string
          enum:
          - queued
          - processing
          - succeeded
          - failed
          - cancelled
        amount:
          type: integer
          example: 1500000
        currency:
          type: string
          example: RUB
        recipient:
          $ref: '#/components/schemas/Recipient'
        error:
          $ref: '#/components/schemas/PayoutError'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    PayoutError:
      type: object
      properties:
        code:
          type: string
          enum:
          - validation_error
          - insufficient_balance
          - recipient_not_found
          - bank_unavailable
          - amount_limit_exceeded
          - rate_limit_exceeded
          - internal_error
        message:
          type: string
    WebhookPayload:
      type: object
      required:
      - event
      - transaction_id
      - state
      properties:
        event:
          type: string
          enum:
          - transfer.succeeded
          - transfer.failed
          - transfer.processing
          - transfer.cancelled
        transaction_id:
          type: string
        reference_id:
          type: string
        state:
          type: string
          enum:
          - queued
          - processing
          - succeeded
          - failed
          - cancelled
        completed_at:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/PayoutError'
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/PayoutError'
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Невалидный API-ключ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Invalid API key
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
          description: Секунд до повторной попытки
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limit_exceeded
              message: Rate limit exceeded, retry after 60 seconds
    InternalError:
      description: Внутренняя ошибка провайдера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
